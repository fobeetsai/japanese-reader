<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Back Card tilted -->
  <rect x="110" y="100" width="280" height="340" rx="24" fill="#6366f1" opacity="0.6" transform="rotate(-8 250 270)" />
  
  <!-- Front Card -->
  <rect x="116" y="86" width="280" height="340" rx="24" fill="url(#cardGrad)" filter="url(#dropShadow)" />
  
  <!-- Card Header Line -->
  <rect x="156" y="136" width="60" height="16" rx="8" fill="#e2e8f0" />
  
  <!-- Big Kanji / Word symbol on card -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">学</text>
  
  <!-- Anki Colors Accent Dots at Bottom -->
  <circle cx="196" cy="370" r="10" fill="#ef4444" />
  <circle cx="236" cy="370" r="10" fill="#f59e0b" />
  <circle cx="276" cy="370" r="10" fill="#3b82f6" />
  <circle cx="316" cy="370" r="10" fill="#10b981" />
</svg>
