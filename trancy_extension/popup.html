<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Trancy Dual 沉浸雙語遮蔽</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h3 {
      margin: 0 0 10px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #818cf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn-act {
      display: block;
      width: 100%;
      padding: 9px 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn-act:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border-radius: 4px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <h3>🌐 Trancy Dual <span class="badge">網頁沉浸版</span></h3>
  <p>在當前日文網頁直接注入雙語對照與雙向遮蔽工具列，鍛鍊看中文回想日語或看日文閱讀理解！</p>

  <button class="btn-act" id="btn-activate">✨ 立即在當前頁面啟用工具列</button>
  <a href="trancy.html" target="_blank" style="text-decoration: none;">
    <button class="btn-act btn-secondary">📖 開啟 Trancy 獨立播放站</button>
  </a>

  <script src="popup.js"></script>
</body>
</html>
